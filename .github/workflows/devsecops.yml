name: Frontend DevSecOps

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://international-payments-api-effxgrgvhwg3afgq.southafricanorth-01.azurewebsites.net' }}

jobs:
  quality-and-security:
    name: Quality and Dependency Security
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Run tests if configured
        run: npm test --if-present

      - name: Build production frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          if-no-files-found: error

  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4

  dependency-review:
    name: Pull Request Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  deploy-production:
    name: Deploy Frontend To Azure App Service
    runs-on: ubuntu-latest
    needs:
      - quality-and-security
      - codeql
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Validate Azure deployment settings
        env:
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if [ -z "$AZURE_WEBAPP_NAME" ]; then
            echo "Missing repository variable: AZURE_WEBAPP_NAME"
            exit 1
          fi

          if [ -z "$AZURE_WEBAPP_PUBLISH_PROFILE" ]; then
            echo "Missing repository secret: AZURE_WEBAPP_PUBLISH_PROFILE"
            exit 1
          fi

      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Create deployment package
        run: |
          mkdir frontend-deploy
          cp -R dist/. frontend-deploy/
          cp azure-app-service/package.json frontend-deploy/package.json
          cp azure-app-service/server.cjs frontend-deploy/server.cjs
          cd frontend-deploy
          zip -r ../frontend-dist.zip .

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: frontend-dist.zip
          target-path: /home/site/wwwroot
          clean: true
          restart: true
