version: 2.1

jobs:
  frontend-quality-and-sonar:
    docker:
      - image: cimg/node:20.19

    steps:
      - checkout:
          method: full

      - restore_cache:
          keys:
            - npm-cache-v1-{{ checksum "package-lock.json" }}
            - npm-cache-v1-

      - run:
          name: Install locked dependencies
          command: npm ci

      - save_cache:
          key: npm-cache-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

      - run:
          name: Audit production dependencies
          command: npm audit --omit=dev --audit-level=high

      - run:
          name: Run ESLint
          command: npm run lint

      - run:
          name: Run TypeScript checks
          command: npm run typecheck

      - run:
          name: Run tests if configured
          command: npm test --if-present

      - run:
          name: Build production frontend
          command: npm run build

      - run:
          name: Validate SonarCloud token
          command: |
            if [ -z "$SONAR_TOKEN" ]; then
              echo "Missing CircleCI environment variable: SONAR_TOKEN"
              exit 1
            fi

      - run:
          name: Run SonarCloud analysis
          command: |
            SCANNER_VERSION=8.0.1.6346
            SCANNER_DIR="sonar-scanner-${SCANNER_VERSION}-linux-x64"
            curl -sSLo sonar-scanner.zip "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${SCANNER_VERSION}-linux-x64.zip"
            unzip -q sonar-scanner.zip
            "./${SCANNER_DIR}/bin/sonar-scanner"

workflows:
  frontend-devsecops:
    jobs:
      - frontend-quality-and-sonar
